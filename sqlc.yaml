version: "2"
plugins:
  - name: "py"
    wasm:
      url: "https://downloads.sqlc.dev/plugin/sqlc-gen-python_1.0.0.wasm"
      sha256: "aca83e1f59f8ffdc604774c2f6f9eb321a2b23e07dc83fc12289d25305fa065b"

sql:
  # Go code
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"

  # Python code
  - schema: "sql/schema"
    queries: "sql/rag_queries"
    engine: "postgresql"
    codegen:
    - plugin: "py"
      out: "rag_server/app/database"
      options:
        package: "database"
        emit_sync_querier: true
        emit_async_querier: false