openapi: 3.0.0
info:
  title: Movie Reserve API
  description: A backend REST API for reserving seats at movie screenings, built in Go.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server
paths:
  /public/api/healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /public/api/users:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /public/api/users/verify:
    put:
      summary: Verify email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                verification_code:
                  type: string
      responses:
        '204':
          description: Email verified successfully
  /public/api/resend-verification:
    post:
      summary: Resend verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification email resent
  /public/api/password-reset:
    post:
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset email sent
  /public/api/users/password-reset:
    put:
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                reset_code:
                  type: string
                new_password:
                  type: string
      responses:
        '204':
          description: Password reset successfully
  /user/api/users/passwords:
    put:
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePassword'
      responses:
        '204':
          description: Password changed successfully
  /user/api/users/emails:
    put:
      summary: Change email
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                new_email:
                  type: string
                  format: email
      responses:
        '204':
          description: Email changed successfully
  /public/api/login:
    post:
      summary: Login and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
  /public/api/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
  /public/api/revoke:
    post:
      summary: Revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Token revoked successfully
  /public/api/genres:
    get:
      summary: List all genres
      responses:
        '200':
          description: A list of genres
          content:
            application/json:
              schema:
                type: object
                properties:
                  genres:
                    type: array
                    items:
                      $ref: '#/components/schemas/Genre'
    post:
      summary: Create a genre (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenre'
      responses:
        '201':
          description: Genre created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  genre:
                    $ref: '#/components/schemas/Genre'
  /public/api/genres/{genreID}:
    get:
      summary: Get a genre by ID
      parameters:
        - name: genreID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single genre
          content:
            application/json:
              schema:
                type: object
                properties:
                  genre:
                    $ref: '#/components/schemas/Genre'
    put:
      summary: Update a genre (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: genreID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenre'
      responses:
        '200':
          description: Genre updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  genre:
                    $ref: '#/components/schemas/Genre'
    delete:
      summary: Delete a genre (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: genreID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Genre deleted successfully
  /public/api/movies:
    get:
      summary: List all movies
      responses:
        '200':
          description: A list of movies
          content:
            application/json:
              schema:
                type: object
                properties:
                  movies:
                    type: array
                    items:
                      $ref: '#/components/schemas/MovieSummary'
    post:
      summary: Create a movie (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovie'
      responses:
        '201':
          description: Movie created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  movie:
                    $ref: '#/components/schemas/MovieDetail'
  /public/api/movies/current:
    get:
      summary: List currently showing movies
      responses:
        '200':
          description: A list of currently showing movies
          content:
            application/json:
              schema:
                type: object
                properties:
                  movies:
                    type: array
                    items:
                      $ref: '#/components/schemas/MovieSummary'
  /public/api/movies/{movieID}:
    get:
      summary: Get a movie by ID
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single movie
          content:
            application/json:
              schema:
                type: object
                properties:
                  movie:
                    $ref: '#/components/schemas/MovieDetail'
    put:
      summary: Update a movie (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovie'
      responses:
        '200':
          description: Movie updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  movie:
                    $ref: '#/components/schemas/MovieDetail'
    delete:
      summary: Delete a movie (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Movie deleted successfully
  /user/api/rag:
    post:
      summary: Query movie information using RAG
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagRequest'
      responses:
        '200':
          description: RAG query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagResponse'
  /public/api/rooms:
    get:
      summary: List all rooms
      responses:
        '200':
          description: A list of rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomSummary'
    post:
      summary: Create a room (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Room created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/RoomDetail'
  /public/api/rooms/{roomID}:
    get:
      summary: Get a room by ID
      parameters:
        - name: roomID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single room
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/RoomDetail'
    put:
      summary: Update a room (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: roomID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Room updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: '#/components/schemas/RoomDetail'
    delete:
      summary: Delete a room (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: roomID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Room deleted successfully
  /public/api/screenings:
    get:
      summary: List upcoming screenings (public)
      parameters:
        - name: movie_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A list of screenings
          content:
            application/json:
              schema:
                type: object
                properties:
                  screenings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScreeningSummary'
    post:
      summary: Create a screening (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScreening'
      responses:
        '200':
          description: Screening created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  screening:
                    $ref: '#/components/schemas/ScreeningDetail'
  /public/api/screenings/{screeningID}:
    get:
      summary: Get a screening by ID
      parameters:
        - name: screeningID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single screening
          content:
            application/json:
              schema:
                type: object
                properties:
                  screening:
                    $ref: '#/components/schemas/ScreeningDetail'
    put:
      summary: Update a screening (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: screeningID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScreening'
      responses:
        '200':
          description: Screening updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  screening:
                    $ref: '#/components/schemas/ScreeningDetail'
    delete:
      summary: Delete a screening (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: screeningID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Screening deleted successfully
  /admin/api/screenings/all:
    get:
      summary: List all screenings including past (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: movie_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A list of all screenings
          content:
            application/json:
              schema:
                type: object
                properties:
                  screenings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScreeningSummary'
  /public/api/seats/{seatID}:
    get:
      summary: Get a seat by ID
      parameters:
        - name: seatID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single seat
          content:
            application/json:
              schema:
                type: object
                properties:
                  seat:
                    $ref: '#/components/schemas/SeatDetail'
  /admin/api/seats:
    post:
      summary: Create a seat (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeat'
      responses:
        '200':
          description: Seat created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  seat:
                    $ref: '#/components/schemas/SeatDetail'
  /admin/api/seats/{seatID}:
    put:
      summary: Update a seat (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: seatID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeat'
      responses:
        '200':
          description: Seat updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  seat:
                    $ref: '#/components/schemas/SeatDetail'
    delete:
      summary: Delete a seat (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: seatID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Seat deleted successfully
  /user/api/reservations:
    get:
      summary: List user's reservations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of user's reservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReservationSummary'
    post:
      summary: Create a reservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                screening_id:
                  type: string
                  format: uuid
                seat_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Reservation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation:
                    $ref: '#/components/schemas/ReservationDetail'
  /user/api/reservations/{reservationID}:
    get:
      summary: Get a reservation by ID
      security:
        - bearerAuth: []
      parameters:
        - name: reservationID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single reservation
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservation:
                    $ref: '#/components/schemas/ReservationDetail'
    delete:
      summary: Delete a reservation
      security:
        - bearerAuth: []
      parameters:
        - name: reservationID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Reservation deleted successfully
  /admin/api/reservations/all:
    get:
      summary: List all reservations with filtering (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: screening_id
          in: query
          schema:
            type: string
            format: uuid
        - name: movie_id
          in: query
          schema:
            type: string
            format: uuid
        - name: room_id
          in: query
          schema:
            type: string
            format: uuid
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A list of all reservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReservationSummary'
  /admin/api/poster_upload/{movieID}:
    post:
      summary: Upload a movie poster (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Poster uploaded successfully

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        email:
          type: string
          format: email
        role:
          type: string
    CreateUser:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UpdatePassword:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    Genre:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateGenre:
      type: object
      properties:
        name:
          type: string
    MovieSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        poster_url:
          type: string
    MovieDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        runtime_minutes:
          type: integer
        release_date:
          type: string
          format: date-time
        poster_url:
          type: string
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
    CreateMovie:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        runtime_minutes:
          type: integer
        release_date:
          type: string
          format: date-time
        genre_ids:
          type: array
          items:
            type: string
            format: uuid
    RoomSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    RoomDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatSummary'
    SeatSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        row_label:
          type: string
        seat_number:
          type: integer
    SeatDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        row_label:
          type: string
        seat_number:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        room:
          $ref: '#/components/schemas/RoomSummary'
    CreateSeat:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
        row_label:
          type: string
        seat_number:
          type: integer
    ScreeningSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        movie:
          $ref: '#/components/schemas/MovieSummary'
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
    ScreeningSeat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        row_label:
          type: string
        seat_number:
          type: integer
        available:
          type: boolean
    ScreeningDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        movie:
          $ref: '#/components/schemas/MovieSummary'
        room:
          $ref: '#/components/schemas/RoomSummary'
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        seats:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningSeat'
    CreateScreening:
      type: object
      properties:
        movie_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    ReservationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        screening:
          $ref: '#/components/schemas/ScreeningSummary'
        seat:
          $ref: '#/components/schemas/SeatSummary'
    ReservationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
