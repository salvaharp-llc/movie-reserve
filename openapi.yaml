openapi: 3.0.0
info:
  title: Movie Reserve API
  description: A backend REST API for reserving seats at movie screenings, built in Go.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server
paths:
  /public/api/healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /public/api/users:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /user/api/users/password:
    put:
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePassword'
      responses:
        '204':
          description: Password changed successfully
  /public/api/login:
    post:
      summary: Login and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
  /public/api/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
  /public/api/revoke:
    post:
      summary: Revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Token revoked successfully
  /public/api/genres:
    get:
      summary: List all genres
      responses:
        '200':
          description: A list of genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Genre'
    post:
      summary: Create a genre
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenre'
      responses:
        '201':
          description: Genre created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
  /public/api/genres/{genreID}:
    get:
      summary: Get a genre by ID
      parameters:
        - name: genreID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single genre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
    put:
      summary: Update a genre
      security:
        - bearerAuth: []
      parameters:
        - name: genreID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenre'
      responses:
        '200':
          description: Genre updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
    delete:
      summary: Delete a genre
      security:
        - bearerAuth: []
      parameters:
        - name: genreID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Genre deleted successfully
  /public/api/movies:
    get:
      summary: List all movies
      responses:
        '200':
          description: A list of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieSummary'
    post:
      summary: Create a movie
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovie'
      responses:
        '201':
          description: Movie created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
  /public/api/movies/current:
    get:
      summary: List currently showing movies
      responses:
        '200':
          description: A list of currently showing movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovieSummary'
  /public/api/movies/{movieID}:
    get:
      summary: Get a movie by ID
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single movie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
    put:
      summary: Update a movie
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovie'
      responses:
        '200':
          description: Movie updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
    delete:
      summary: Delete a movie
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Movie deleted successfully
  /admin/api/poster_upload/{movieID}:
    post:
      summary: Upload a movie poster
      security:
        - bearerAuth: []
      parameters:
        - name: movieID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Poster uploaded successfully

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        email:
          type: string
          format: email
        role:
          type: string
    CreateUser:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UpdatePassword:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    Genre:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateGenre:
      type: object
      properties:
        name:
          type: string
    MovieSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        poster_url:
          type: string
    MovieDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        runtime_minutes:
          type: integer
        release_date:
          type: string
          format: date-time
        poster_url:
          type: string
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
    CreateMovie:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        runtime_minutes:
          type: integer
        release_date:
          type: string
          format: date-time
        genre_ids:
          type: array
          items:
            type: string
            format: uuid
